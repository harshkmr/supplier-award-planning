[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-award"
version = "0.1.0"
description = "Harden supplier award planning with ISO container limits, live FX rates, and Valgrind-clean C scoring."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Kumar"}]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
supplier-award = "supplier_award.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["supplier_award*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
